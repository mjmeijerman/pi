# Audit configuration for the zizmor gate (.github/workflows/zizmor.yml).
#
# The `rules:` block is empty on purpose. The one deliberate ad-hoc install —
# harness-check.yml bumps npm itself because min-release-age is only honoured from
# npm 11.10 (blip 99) and the runner's bundled npm is older than the major
# mise.toml pins — is ignored by an inline `# zizmor: ignore[adhoc-packages]`
# comment on the install line itself, the way test.yml's optional pi-package
# install already is. A comment travels with its line; the `harness-check.yml:NN`
# entry this file used to carry did not, and that number has now needed editing
# twice for the same reason: a line inserted above the install (the
# node-version-file comment) moved it from 42 to 44 and the gate went red with the
# finding still present, only at a different line.
#
# npm cannot be installed "from a lockfile" in that spot — the whole point is to
# replace the npm that would run `npm ci` — so the install is pinned to an exact
# version instead, and check_mise_pins holds that version to mise.toml's `npm`.
# Nothing here suppresses by path, line or audit: any other ad-hoc install, or a
# second one in harness-check.yml, still fails the gate.

rules: {} # no rule-level ignores: see the note above
