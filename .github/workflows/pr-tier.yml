# The review tier in the PR body, enforced instead of trusted.
#
# Radar basis: #17 risk-tiered human oversight (Trial), #42 human-in-the-loop
# theater (Caution), #3 path-to-production mapping (Adopt).
#
# `agent/AGENTS.md` defines High/Medium/Low and says the tier goes in the PR
# body, which was a rule nobody checked: a PR could say nothing and still land.
# This job fails the PR unless the body states a tier, and fails a tier below
# High when the diff touches harness paths. The measurement is the check itself:
# red on a body without a tier, red on a harness diff claiming Medium.
#
# Everything from the PR body arrives through `env` and is only ever matched in
# bash, never interpolated into a command line (injection, blip 38).
#
# The mission line in the PR body, enforced instead of assumed.
#
# Radar basis: #41 coding throughput as a metric (Hold), #17 risk-tiered human
# oversight (Trial), #3 path-to-production mapping (Adopt).
#
# `docs/kent-beck-craft-harness.md` says every change opens with who is better
# off and how we would see it, and that LOC, PR count and token spend are effort,
# which is definitionally not mission. That was a rule nobody checked: a body
# could carry a tier and say nothing about why anyone gains. This job fails the
# PR unless the body has a `Mission:` line of at least 20 characters after the
# prefix, so "Mission: fix" does not pass as a mission. Measured the way the
# Radar blip is measured: the share of PRs with a mission line, which is the
# check itself — red on a body without one, red on a one-word mission.
name: pr-tier

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  # The job reads the PR body and the diff, and nothing else.
  contents: read
  pull-requests: read  # read the PR body only; never write

concurrency:
  group: pr-tier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier:
    name: review tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: the path mapping diffs against the base branch.
          fetch-depth: 0

      - name: tier stated in the PR body, and high enough for the diff
        env:
          # Untrusted input: quoted, never expanded into a command.
          PR_BODY: ${{ github.event.pull_request.body }}
          # Commits, not refs: both shas are in the checked-out history, so the
          # job needs no network and no credentials (blip 103, unpinned-uses /
          # artipacked).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nocasematch

          # 1) The tier. `Review tier: High`, `**Review tier:** high`, `Review tier : LOW`.
          tier=""
          if [[ $PR_BODY =~ review[[:space:]]+tier[[:space:]]*:[[:space:]]*\*{0,2}[[:space:]]*(high|medium|low) ]]; then
            tier="${BASH_REMATCH[1],,}"
          fi
          if [[ -z $tier ]]; then
            echo "::error::the PR body states no review tier (blips 17, 42). Add one of: Review tier: High / Medium / Low"
            {
              echo "## Review tier: missing"
              echo ""
              echo "No \`Review tier: High|Medium|Low\` line in the PR body."
              echo "Tiers are defined in \`agent/AGENTS.md\`."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "tier: $tier"

          # 2) The diff. Merge-base diff, so unrelated trunk commits do not count.
          # Both endpoints are already in the local clone (fetch-depth: 0), which
          # is why this needs neither the token nor a fetch.
          mapfile -t changed < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "changed files: ${#changed[@]}"

          # 3) Harness paths. Touching any of them is High, whatever the body says.
          harness=()
          for path in "${changed[@]}"; do
            case "$path" in
              agent/extensions/*|git-hooks/*|sandbox/*|.github/*|agent/AGENTS.md)
                harness+=("$path")
                ;;
            esac
          done

          {
            echo "## Review tier: ${tier}"
            echo ""
            echo "Changed files: ${#changed[@]}"
            if (( ${#harness[@]} > 0 )); then
              echo ""
              echo "Harness paths in the diff (tier must be High):"
              echo ""
              printf -- '- `%s`\n' "${harness[@]}"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          if (( ${#harness[@]} > 0 )) && [[ $tier != high ]]; then
            printf '::error::harness paths changed; tier must be High (blips 17, 42) — offending paths: %s\n' "${harness[*]}"
            exit 1
          fi

          echo "tier check passed: $tier"

  # A test change and a source change in the same pull request have to explain
  # themselves. Editing `x.test.ts` beside `x.ts` is how an assertion gets bent
  # to fit the code instead of the other way round, so the body must say why the
  # test moved. Accepted: a `Test change: <reason>` line with an actual reason,
  # not a placeholder. Measurement: red on a source+test diff without that line.
  test-change-reason:
    name: test change justified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Both endpoints are already in the clone: no network, no token.
          fetch-depth: 0

      - name: a changed test needs its reason in the PR body
        env:
          # Untrusted input: quoted, only ever matched in bash below.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nocasematch

          mapfile -t changed < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          tests=(); source=()
          for path in "${changed[@]}"; do
            case "$path" in
              *.test.ts) tests+=("$path") ;;
              *.ts|*.tsx|*.js|*.mjs|*.cjs|*.sh|*.py) source+=("$path") ;;
            esac
          done

          echo "tests changed: ${#tests[@]}; source changed: ${#source[@]}"

          if (( ${#tests[@]} == 0 )); then
            echo "no test file changed; nothing to justify"
            exit 0
          fi
          if (( ${#source[@]} == 0 )); then
            echo "tests changed without source beside them; not this gate"
            exit 0
          fi

          # `Test change: the retry needed a fake clock` and `**Test change:** ...`
          # both count: emphasis is stripped first, and `.` stops at the end of
          # the line, so the reason is one line, not the rest of the body.
          flat="${PR_BODY//\*/}"
          reason=""
          if [[ $flat =~ test[[:space:]]+change[[:space:]]*:[[:space:]]*(.+) ]]; then
            reason="${BASH_REMATCH[1]}"
          fi
          # Trailing whitespace would make an empty reason look long enough.
          reason="$(printf '%s' "$reason" | sed -e 's/[[:space:]]*$//')"
          echo "reason: ${reason:-<none>}"

          if (( ${#reason} < 10 )); then
            {
              echo "## Test change: reason missing"
              echo ""
              echo "This pull request changes a test file next to source:"
              echo ""
              printf -- '- test: `%s`\n' "${tests[@]}"
              printf -- '- source: `%s`\n' "${source[@]}"
              echo ""
              echo "Add a line to the PR body:"
              echo ""
              echo '`Test change: <why the test had to change>`'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::a test file and its source changed together; the PR body needs a 'Test change: <reason>' line"
            exit 1
          fi

          echo "::notice::test change justified: ${reason}"
          {
            echo "## Test change: justified"
            echo ""
            echo "${reason}"
          } >>"$GITHUB_STEP_SUMMARY"

  # A pull request has to say who is better off. Tier says how much review the
  # change needs; mission says why the change is worth reviewing at all, and the
  # difference is the whole point of blip 41: a busy PR list is not a better
  # harness. Accepted: a `Mission:` line, bold or not, case-insensitive, with at
  # least 20 characters after the prefix. Measurement: red on a body with no
  # mission line, red on one that says less than a sentence.
  mission-stated:
    name: mission stated
    runs-on: ubuntu-latest
    steps:
      # No checkout: this gate reads the PR body and nothing else, so no branch
      # content is fetched or executed to decide it.
      - name: mission line in the PR body, and long enough to mean something
        env:
          # Untrusted input: quoted, and only ever matched in bash below.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          shopt -s nocasematch

          # Emphasis is stripped first, the way the test-change gate does it, so
          # `**Mission:** ...` counts as a mission line.
          flat="${PR_BODY//\*/}"

          found=0
          mission=""
          while IFS= read -r line; do
            # Leading whitespace and space around the colon are tolerated; the
            # line is what matters, not its punctuation.
            if [[ $line =~ ^[[:space:]]*mission[[:space:]]*:[[:space:]]*(.*)$ ]]; then
              found=1
              mission="${BASH_REMATCH[1]}"
              break
            fi
          done <<<"$flat"

          if (( found == 0 )); then
            echo "::error::the PR body states no mission (blip 41: effort is not mission). Add a line: Mission: <who is better off, and how you would see it>"
            {
              echo "## Mission: missing"
              echo ""
              echo "No \`Mission:\` line in the PR body."
              echo "Define it as \`docs/kent-beck-craft-harness.md\` does: who is better off,"
              echo "and the observation that shows the gain. Effort is not mission."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Trailing whitespace would make a short mission look long enough.
          mission="$(printf '%s' "$mission" | sed -e 's/[[:space:]]*$//')"
          echo "mission: ${mission:-<empty>}"

          if (( ${#mission} < 20 )); then
            echo "::error::the Mission line is ${#mission} characters after the prefix; a mission names who gains and how we would see it, at least 20 characters"
            {
              echo "## Mission: too short"
              echo ""
              echo "\`Mission:\` is filled in, but only with \`${mission:-<empty>}\`."
              echo "A mission names the person or system that gains and the observation that shows it."
              echo "Example: \`Mission: a reviewer sees which gate failed without opening the logs.\`"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::notice::mission stated: ${mission}"
          {
            echo "## Mission: stated"
            echo ""
            echo "${mission}"
          } >>"$GITHUB_STEP_SUMMARY"
