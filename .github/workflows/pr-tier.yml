# The review tier in the PR body, enforced instead of trusted.
#
# Radar basis: #17 risk-tiered human oversight (Trial), #42 human-in-the-loop
# theater (Caution), #3 path-to-production mapping (Adopt).
#
# `agent/AGENTS.md` defines High/Medium/Low and says the tier goes in the PR
# body, which was a rule nobody checked: a PR could say nothing and still land.
# This job fails the PR unless the body states a tier, and fails a tier below
# High when the diff touches harness paths. The measurement is the check itself:
# red on a body without a tier, red on a harness diff claiming Medium.
#
# Everything from the PR body arrives through `env` and is only ever matched in
# bash, never interpolated into a command line (injection, blip 38).
#
# The mission line in the PR body, enforced instead of assumed.
#
# Radar basis: #41 coding throughput as a metric (Hold), #17 risk-tiered human
# oversight (Trial), #3 path-to-production mapping (Adopt).
#
# `docs/kent-beck-craft-harness.md` says every change opens with who is better
# off and how we would see it, and that LOC, PR count and token spend are effort,
# which is definitionally not mission. That was a rule nobody checked: a body
# could carry a tier and say nothing about why anyone gains. This job fails the
# PR unless the body has a `Mission:` line of at least 20 characters after the
# prefix, so "Mission: fix" does not pass as a mission. Measured the way the
# Radar blip is measured: the share of PRs with a mission line, which is the
# check itself — red on a body without one, red on a one-word mission.
#
# Both gates are `scripts/pr-gate.sh` now, not bash written into this file.
# Carrying the logic here meant the first news of a bad body was a red check
# after the push, and that CI and any local check were two copies that could
# disagree; the script is the one copy, and `make pr-check` is the local caller.
name: pr-tier

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  # The job reads the PR body and the diff, and nothing else.
  contents: read
  pull-requests: read  # read the PR body only; never write

concurrency:
  group: pr-tier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier:
    name: review tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: the path mapping diffs against the base branch.
          fetch-depth: 0

      - name: tier stated in the PR body, and high enough for the diff
        env:
          # Untrusted input: quoted, never expanded into a command.
          PR_BODY: ${{ github.event.pull_request.body }}
          # Commits, not refs: both shas are in the checked-out history, so the
          # job needs no network and no credentials (blip 103, unpinned-uses /
          # artipacked).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # The body reaches the gate as a file, never as an argument: it is
          # untrusted text and stays quoted (blip 38).
          printf '%s' "$PR_BODY" >"$RUNNER_TEMP/pr-body.md"

          # One implementation, two callers: this job and `make pr-check` run
          # the same script, so CI and a local run cannot disagree about a body.
          # The copy is taken from the base commit — a gate a branch may rewrite
          # is not a gate — and only on the PR that first adds this file, when
          # the base copy does not exist yet, does the checked-out one stand in.
          gate="$RUNNER_TEMP/pr-gate.sh"
          if ! git show "${BASE_SHA}:scripts/pr-gate.sh" >"$gate" 2>/dev/null; then
            cp scripts/pr-gate.sh "$gate"
          fi

          bash "$gate" --gate tier --body "$RUNNER_TEMP/pr-body.md" \
            --base "$BASE_SHA" --head "$HEAD_SHA"

  # A test change and a source change in the same pull request have to explain
  # themselves. Editing `x.test.ts` beside `x.ts` is how an assertion gets bent
  # to fit the code instead of the other way round, so the body must say why the
  # test moved. Accepted: a `Test change: <reason>` line with an actual reason,
  # not a placeholder. Measurement: red on a source+test diff without that line.
  test-change-reason:
    name: test change justified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Both endpoints are already in the clone: no network, no token.
          fetch-depth: 0

      - name: a changed test needs its reason in the PR body
        env:
          # Untrusted input: quoted, only ever matched in bash below.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          printf '%s' "$PR_BODY" >"$RUNNER_TEMP/pr-body.md"

          # Same shared script as the tier job, and taken from the base commit
          # for the same reason: a branch does not get to rewrite its gate.
          gate="$RUNNER_TEMP/pr-gate.sh"
          if ! git show "${BASE_SHA}:scripts/pr-gate.sh" >"$gate" 2>/dev/null; then
            cp scripts/pr-gate.sh "$gate"
          fi

          bash "$gate" --gate test-change --body "$RUNNER_TEMP/pr-body.md" \
            --base "$BASE_SHA" --head "$HEAD_SHA"

  # A pull request has to say who is better off. Tier says how much review the
  # change needs; mission says why the change is worth reviewing at all, and the
  # difference is the whole point of blip 41: a busy PR list is not a better
  # harness. Accepted: a `Mission:` line, bold or not, case-insensitive, with at
  # least 20 characters after the prefix. Measurement: red on a body with no
  # mission line, red on one that says less than a sentence.
  mission-stated:
    name: mission stated
    runs-on: ubuntu-latest
    steps:
      # No diff and no branch content decides this gate; it reads the PR body
      # and the shared gate script, which comes from the base commit. History is
      # fetched only so `${BASE_SHA}:scripts/pr-gate.sh` resolves without a
      # second network call and without the token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: mission line in the PR body, and long enough to mean something
        env:
          # Untrusted input: quoted, and only ever matched in bash below.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          printf '%s' "$PR_BODY" >"$RUNNER_TEMP/pr-body.md"

          gate="$RUNNER_TEMP/pr-gate.sh"
          if ! git show "${BASE_SHA}:scripts/pr-gate.sh" >"$gate" 2>/dev/null; then
            cp scripts/pr-gate.sh "$gate"
          fi

          bash "$gate" --gate mission --body "$RUNNER_TEMP/pr-body.md"

  # A harness change cites a Thoughtworks Radar blip, with the problem it fixes
  # and how it is measured: `agent/AGENTS.md` says so, and nothing checked it.
  # Measured 2026-11-22: none of the last 25 commits on trunk cited one, so the
  # rule was prose and the prose lost. The gate applies to a diff that changes
  # code (bin/, scripts/, agent/extensions/, git-hooks/, sandbox/, .github/) and
  # asks for a `Radar:` line naming a blip in docs/radar-blips.tsv plus the way
  # the change is measured. Measurement: red on a code diff with no citation,
  # red on a blip number that is not in the list.
  radar-cited:
    name: radar blip cited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Both endpoints are already in the clone: no network, no token.
          fetch-depth: 0

      - name: a code diff cites a Radar blip, and says how it is measured
        env:
          # Untrusted input: quoted, and only ever matched in bash below.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          printf '%s' "$PR_BODY" >"$RUNNER_TEMP/pr-body.md"

          # Same shared script, taken from the base commit for the same reason:
          # a branch does not get to rewrite its gate — and only this job
          # narrows that, because a brand-new gate can only be introduced by a
          # branch whose own copy of the script knows it. The base copy on that
          # PR exits 2 with `not 'radar'`; that one verdict, and nothing else,
          # means the base copy predates the gate, so the checkout's own copy is
          # put in its place and run again. Any other failure is the gate's
          # verdict and stays red. The moment trunk carries the gate the base
          # copy answers, so it is preferred again and this fallback goes quiet.
          gate="$RUNNER_TEMP/pr-gate.sh"
          if ! git show "${BASE_SHA}:scripts/pr-gate.sh" >"$gate" 2>/dev/null; then
            cp scripts/pr-gate.sh "$gate"
          else
            # Unquoted exit status, so `set -e` must stand aside to read it.
            set +e
            out="$(bash "$gate" --gate radar --body "$RUNNER_TEMP/pr-body.md" \
              --base "$BASE_SHA" --head "$HEAD_SHA" 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$out"
            if [[ $rc -eq 2 && $out == *"not 'radar'"* ]]; then
              cp scripts/pr-gate.sh "$gate"
            else
              exit "$rc"
            fi
          fi

          bash "$gate" --gate radar --body "$RUNNER_TEMP/pr-body.md" \
            --base "$BASE_SHA" --head "$HEAD_SHA"
