name: tests

on:
  push:
    branches: [trunk]
  pull_request:
  # Mutation testing is slow (minutes, not seconds), so it never gates a PR.
  # Weekly schedule plus a manual button; Radar Vol. 35, blip 2 (Adopt).
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-tests:
    name: extension tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      # The stubs delegate to the real pi-ai / pi-tui so cost and width math is
      # pi's own. Optional: when the registry is unavailable the fidelity tests
      # skip instead of failing the build.
      - name: install pi packages (optional)
        continue-on-error: true
        # Deliberately outside a lockfile: the two packages are already pinned to
        # exact versions here, --no-save/--no-package-lock keep the agent
        # lockfile from being rewritten by a fidelity-only test dependency, and
        # the step is continue-on-error because the registry can be absent.
        # zizmor: ignore[adhoc-packages]
        run: npm install --no-save --no-package-lock @earendil-works/pi-ai@1.5.2 @earendil-works/pi-tui@1.5.2

      - name: test
        env:
          PI_REAL_PACKAGES_DIR: ${{ github.workspace }}/agent/node_modules/@earendil-works
        run: npm test

  mutation:
    name: mutation score (stryker)
    runs-on: ubuntu-latest
    # Weekly and on demand only: never on pull_request or push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: false
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: install
        run: npm ci

      # Incremental state makes the weekly run cheap: mutants whose source and
      # covering tests are unchanged keep their previous verdict.
      - name: restore incremental state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: agent/reports/stryker/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-

      - name: stryker run
        run: npx stryker run

      - name: keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-report
          path: agent/reports/stryker/
          if-no-files-found: warn

  # A pull request may not ship a surviving mutant. The weekly `mutation` job
  # above is the score of record; this one asks only about the diff: do the
  # mutants in these files die? Scoped --mutate keeps it to minutes, break 100
  # makes one survivor fail the PR, and the verdict never comes from a cached
  # run: stryker 10.1.1 spells "ignore the incremental file" `--force`
  # (`--incremental false` is not a flag — it is read as a config path and dies
  # with `ConfigReaderError: Invalid config file "false"`), and the derived
  # config below sets `incremental: false` outright. Radar Vol. 35, blip 2.
  mutation-changed:
    name: mutation on changed files (stryker)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # A slow run must not hold the queue: a per-PR budget, not a hang.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: origin/trunk has to exist for the diff, and both
          # endpoints are then already in the clone, so no token and no fetch.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: changed TypeScript under agent/extensions
        id: changed
        run: |
          set -euo pipefail
          base=origin/trunk
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "::error::$base is missing; this job needs fetch-depth: 0 to diff against trunk"
            exit 1
          fi

          # `:(glob,top)` is root-relative (so this step works whatever the
          # job's working-directory is) and turns on glob magic, which is what
          # makes `**/` match zero directories. Without it git reads `**` as one
          # ordinary segment, so the .ts files sitting directly in
          # agent/extensions — most of them — never matched.
          mapfile -t all < <(git diff --name-only "$base"...HEAD -- ':(glob,top)agent/extensions/**/*.ts')
          files=()
          for path in "${all[@]}"; do
            case "$path" in
              *.test.ts) continue ;;  # mutating a test proves nothing about a test
            esac
            # Stryker runs with working-directory agent, so drop the agent/ prefix.
            files+=("${path#agent/}")
          done

          echo "changed source files: ${#files[@]}"
          if (( ${#files[@]} > 0 )); then printf '  %s\n' "${files[@]}"; fi

          if (( ${#files[@]} == 0 )); then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            {
              echo "### mutation on changed files: skipped"
              echo ""
              echo 'No TypeScript source changed under `agent/extensions` in this pull request.'
              echo 'Nothing to mutate, so the job is green on purpose; the weekly'
              echo '`mutation` job stays the score of record.'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "no TypeScript source changed under agent/extensions - nothing to mutate, skipping green"
            exit 0
          fi

          echo "skip=false" >>"$GITHUB_OUTPUT"
          {
            echo "files<<MUTATE_EOF"
            printf '%s\n' "${files[@]}"
            echo "MUTATE_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: install
        if: steps.changed.outputs.skip != 'true'
        run: npm ci

      # stryker 10's CLI has no --thresholds flag (it rejects
      # --thresholds.break) and no boolean `--incremental` value to switch off
      # (10.1.1 reads `--incremental false` as a config path and exits with
      # `Invalid config file "false"`; `--force` skips the cached file but
      # cannot express break 100), so the PR verdict is built from the weekly
      # config with two keys changed: incremental off, so a PR never inherits a
      # cached run, and break 100, so one surviving mutant fails the job.
      # Derived, not copied: the two configs cannot drift.
      - name: pr mutation config (break 100, no incremental)
        if: steps.changed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const base = JSON.parse(readFileSync("stryker.conf.json", "utf8"));
            writeFileSync("stryker.pr.conf.json", JSON.stringify({
              ...base,
              incremental: false,
              thresholds: { ...base.thresholds, break: 100 },
              htmlReporter: { fileName: "reports/stryker-pr/mutation.html" },
              jsonReporter: { fileName: "reports/stryker-pr/mutation.json" },
            }, null, 2) + "\n");
          '

      - name: stryker on exactly the changed files
        if: steps.changed.outputs.skip != 'true'
        env:
          # Passed through env, never expanded into the script: file names are
          # untrusted input (injection, blip 38).
          MUTATE_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r file; do
            if [[ -n $file ]]; then args+=(--mutate "$file"); fi
          done <<<"$MUTATE_FILES"
          printf 'mutating: %s\n' "${args[*]}"
          npx stryker run stryker.pr.conf.json "${args[@]}"

      - name: keep the report
        if: always() && steps.changed.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-report-changed
          path: |
            agent/reports/stryker/
            agent/reports/stryker-pr/
          if-no-files-found: warn

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: syntax
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          printf '%s\n' "${files[@]}"
          for f in "${files[@]}"; do bash -n "$f"; done
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck --severity=error "${files[@]}"

  # Radar Vol. 35 blip 89 (Deepsec: a scanner in the pipeline) and blip 6 (threat
  # modelling — docs/threat-model.md is the scope statement this job checks that
  # code still lives up to). semgrep and trivy were installed on this machine and
  # ran in nothing: a scan nobody can point at is a habit, not a gate. One job,
  # one verdict — any finding fails the run — and the summary names every file
  # and package that was read, so green means "scanned and clean" rather than
  # "the step existed".
  security-scan:
    name: security scan (semgrep, trivy)
    runs-on: ubuntu-latest
    # A gate that makes a pull request wait ten minutes is a gate people turn
    # off. Cold, this is two pinned downloads plus a scan of ~60 files and one
    # lockfile; five minutes is the ceiling, not the target.
    timeout-minutes: 5
    env:
      SEMGREP_VERSION: 1.185.0
      TRIVY_VERSION: 0.76.2
      # `p/bash` is not a registry pack (semgrep.dev/c/p/bash is a 404), so the
      # shell ruleset is pinned by commit instead of by name: the same rule text
      # on every run, and a rule change is a reviewable edit to this line.
      SEMGREP_RULES_SHA: a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Nothing worth caching: uvx resolves one pinned package in seconds,
          # and a cache keyed on a sdist is one more thing to poison.
          enable-cache: false

      - name: install scanners (pinned)
        run: |
          set -euo pipefail
          # trivy: release tarball checked against the checksum the release
          # publishes. A version pin alone does not survive a replaced asset.
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "$base/$asset" -o "$RUNNER_TEMP/$asset"
          curl -sSfL "$base/trivy_${TRIVY_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          grep -F " $asset" "$RUNNER_TEMP/checksums.txt" >"$RUNNER_TEMP/asset.sha256"
          ( cd "$RUNNER_TEMP" && sha256sum --check --strict asset.sha256 )
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" trivy

          # The shell ruleset, pinned by the commit it came from.
          curl -sSfL "https://github.com/semgrep/semgrep-rules/archive/${SEMGREP_RULES_SHA}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          rules="$RUNNER_TEMP/semgrep-rules-${SEMGREP_RULES_SHA}"

          {
            echo "TRIVY_BIN=$RUNNER_TEMP/trivy"
            echo "SEMGREP_RULES=$rules"
          } >>"$GITHUB_ENV"

          "$RUNNER_TEMP/trivy" --version | sed -n '1p'
          printf 'semgrep-rules bash set: %s file(s) at %s\n' \
            "$(find "$rules/bash" -name '*.yaml' | wc -l)" "$SEMGREP_RULES_SHA"

      - name: semgrep (p/default, p/typescript, pinned bash rules)
        id: semgrep
        # A finding must not stop the other scanner from reporting: the verdict
        # step below is what fails the job, and the summary is most useful when
        # every scanner has spoken.
        continue-on-error: true
        run: |
          set -euo pipefail
          # Tracked source only, and as an explicit list: a green run can be
          # compared against `git ls-files`, so a file that stopped being
          # scanned shows up as a smaller number instead of as a pass.
          mapfile -t targets < <(git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.sh')
          printf 'semgrep targets: %d file(s)\n' "${#targets[@]}"
          # Registry packs need the network, which CI has; --json-output keeps the
          # JSON report next to the human one. --error is the gate: semgrep exits 0
          # on findings by default, so without it this job would be green on a
          # finding — measured, not assumed (1.185.0 returns 1 with --error and 0
          # without, on the same file).
          uvx --from "semgrep==${SEMGREP_VERSION}" semgrep scan \
            --config p/default \
            --config p/typescript \
            --config "${SEMGREP_RULES}/bash" \
            --metrics=off \
            --disable-version-check \
            --error \
            --json-output "$RUNNER_TEMP/semgrep.json" \
            "${targets[@]}"

      - name: trivy (dependencies, secrets, configuration)
        id: trivy
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          # --include-dev-deps on purpose: stryker and the test toolchain run in
          # this workflow, so a vulnerable dev dependency is a reachable one here.
          "$TRIVY_BIN" fs \
            --scanners vuln \
            --include-dev-deps \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "$RUNNER_TEMP/trivy-vuln.json" \
            . || status=1
          # Secrets and configuration: any finding fails, at any severity — a
          # leaked key in a tracked file is not a low-priority one.
          "$TRIVY_BIN" fs \
            --scanners secret,misconfig \
            --exit-code 1 \
            --format json \
            --output "$RUNNER_TEMP/trivy-rest.json" \
            . || status=1
          exit "$status"

      # always(): a red scan is exactly when the reader needs to know what was
      # read and which rule fired. A scanner that wrote no report says so instead
      # of counting as zero findings.
      - name: report what was scanned
        if: always()
        run: |
          set -euo pipefail
          export SCANNED_FILES="$(git ls-files | wc -l)"
          node .github/scripts/security-summary.mjs \
            "$RUNNER_TEMP/semgrep.json" \
            "$RUNNER_TEMP/trivy-vuln.json" \
            "$RUNNER_TEMP/trivy-rest.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # The one verdict. Both scan steps are continue-on-error so that a finding
      # in the first cannot hide the second scanner's report, and this step reads
      # their outcomes rather than trusting the job's colour: `success` is the
      # only value that means "ran and found nothing".
      - name: verdict
        if: always()
        env:
          # Through env, never expanded into the script.
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          set -euo pipefail
          printf 'semgrep: %s\ntrivy: %s\n' "$SEMGREP_OUTCOME" "$TRIVY_OUTCOME"
          if [ "$SEMGREP_OUTCOME" != success ] || [ "$TRIVY_OUTCOME" != success ]; then
            echo "::error::a scanner found something or did not finish - the summary above names what it read and what it found"
            exit 1
          fi
          echo "security scan clean: every scanner ran and reported nothing"
