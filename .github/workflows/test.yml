name: tests

on:
  push:
    branches: [trunk]
  pull_request:
  # Mutation testing is slow (minutes, not seconds), so it never gates a PR.
  # Weekly schedule plus a manual button; Radar Vol. 35, blip 2 (Adopt).
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-tests:
    name: extension tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The first axis must equal mise.toml's `node`: a matrix cannot compute it,
        # so scripts/harness-check.sh FAILs when the two disagree (blip 68).
        node: ["24", "26"]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      # The stubs delegate to the real pi-ai / pi-tui so cost and width math is
      # pi's own. Optional: when the registry is unavailable the fidelity tests
      # skip instead of failing the build.
      - name: install pi packages (optional)
        continue-on-error: true
        # Deliberately outside a lockfile: the two packages are already pinned to
        # exact versions here, --no-save/--no-package-lock keep the agent
        # lockfile from being rewritten by a fidelity-only test dependency, and
        # the step is continue-on-error because the registry can be absent.
        # zizmor: ignore[adhoc-packages]
        run: npm install --no-save --no-package-lock @earendil-works/pi-ai@1.5.2 @earendil-works/pi-tui@1.5.2

      - name: test
        env:
          PI_REAL_PACKAGES_DIR: ${{ github.workspace }}/agent/node_modules/@earendil-works
        run: npm test

  mutation:
    name: mutation score (stryker)
    runs-on: ubuntu-latest
    # Weekly and on demand only: never on pull_request or push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: false
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # .node-version is mise.toml's `node` projected, because this action
          # reads no TOML; drift between the two FAILs harness-check (blip 68).
          # Relative: setup-node resolves node-version-file against the workspace
          # root, not against defaults.run.working-directory, so "agent" here
          # cannot matter — and an absolute value is joined onto it twice.
          node-version-file: .node-version

      - name: install
        run: npm ci

      # Incremental state makes the weekly run cheap: mutants whose source and
      # covering tests are unchanged keep their previous verdict.
      - name: restore incremental state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: agent/reports/stryker/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-

      - name: stryker run
        run: npx stryker run

      - name: keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-report
          path: agent/reports/stryker/
          if-no-files-found: warn

  # A pull request may not ship a surviving mutant. The weekly `mutation` job
  # above is the score of record; this one asks only about the diff: do the
  # A pull request may not ship a surviving mutant. The weekly `mutation` job
  # above is the score of record; this one asks only about the diff: do the
  # mutants this branch's added lines introduce die? Scoping to lines, not to
  # files, is what makes that question answerable and the run affordable —
  # file scope mutated all 1042 mutants of agent/extensions/secret-guard.ts
  # (~20% of them survivors that predate the branch, so `break: 100` was
  # unreachable) and both PRs that ran it in that shape — #106 and #110 — were
  # killed by the 25-minute budget below at 65% and 68%. A few hunks are a few
  # dozen mutants. `scripts/mutate-changed.sh` derives the ranges, and the range
  # rule has its own tests, so what is mutated here is decided where it is
  # checked. break 100 makes one surviving mutant fail the PR.
  mutation-changed:
    name: mutation on changed files (stryker)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # A slow run must not hold the queue: a per-PR budget, not a hang. The
    # number is arithmetic, not appetite. Measured on the PR #106 run (job
    # 134170533027, 710 mutants in 25m18s at stryker's default concurrency of
    # cpuCount, i.e. 4 workers, including 13 timeouts at 60s): one mutant costs
    # 7.45 worker-seconds. The largest plausible diff is every file a PR can
    # mutate at once — 1463 mutants (secret-guard 1042 + merge-guard 341 +
    # lib/usage-format 80, measured with --dryRunOnly) — and 1463 x 7.45 / 4
    # workers = 45.4 minutes with no help from the concurrency flag below. 60
    # covers that worst case with 32% headroom, so a legitimate large diff
    # finishes instead of being cancelled mid-run, while a wedged mutant still
    # dies by the cap rather than by the runner's 6-hour default.
    #
    # A gate that runs too long is theater; a cap that reports is a budget. The
    # budget here is 200 mutants — 200 x 7.45 / 4 workers is about six minutes of
    # mutants on top of the install and the initial test run — and it is chosen
    # deterministically, file then line, so the same diff always tests the same
    # 200 and two pushes of it stay comparable. What the cap defers is not
    # forgotten: it is printed into the job summary and it is what the weekly
    # `mutation` job (uncapped, break null, its own cache) sweeps in full.
    # --cap lives in scripts/mutate-changed.sh, next to the range rule it spends;
    # --cap 0 means no cap, which is why the weekly path passes nothing at all.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: origin/trunk has to exist for the diff, and both
          # endpoints are then already in the clone, so no token and no fetch.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # mise.toml's `node`, projected: setup-node cannot read a TOML file.
          node-version-file: .node-version

      # The range rule is `scripts/mutate-changed.sh`, not a copy of it: the
      # same script `make mutate-changed` runs, so the branch check a worker runs
      # locally and the one CI runs cannot disagree about their scope.
      - name: added lines under agent/extensions, as line-scoped mutate ranges
        id: changed
        run: |
          set -euo pipefail
          base=origin/trunk
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "::error::$base is missing; this job needs fetch-depth: 0 to diff against trunk"
            exit 1
          fi

          # One `path:start-end` per hunk with added lines, relative to agent/
          # (stryker's working-directory). Empty is a verdict, not an error:
          # nothing was added, so this branch cannot have introduced a mutant.
          ranges="$(bash ../scripts/mutate-changed.sh --base "$base" --list-only)"
          count=0
          if [[ -n $ranges ]]; then count=$(grep -c . <<<"$ranges"); fi

          echo "added mutant ranges: $count"
          if (( count > 0 )); then printf '  %s\n' $ranges; fi

          if (( count == 0 )); then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            {
              echo "### mutation on changed files: skipped"
              echo ""
              echo 'No line was added to a TypeScript source under `agent/extensions` in this pull request.'
              echo 'Nothing new to mutate, so the job is green on purpose; the weekly'
              echo '`mutation` job stays the score of record.'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "no added line under agent/extensions - nothing to mutate, skipping green"
            exit 0
          fi

          echo "skip=false" >>"$GITHUB_OUTPUT"
          {
            echo "files<<MUTATE_EOF"
            printf '%s\n' "$ranges"
            echo "MUTATE_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: install
        if: steps.changed.outputs.skip != 'true'
        run: npm ci

      # The wall time is the mutants, not the checkout: 710 of them cost 25m18s,
      # and a re-push on the same base asks about the same mutants again. Stryker
      # keeps their verdicts in an incremental report, and until now this job
      # threw it away (the derived config below set `incremental: false`, because
      # 10.1.1 has no CLI flag for it — `--incremental false` is read as a config
      # path and dies with `ConfigReaderError: Invalid config file "false"`, and
      # `--force` skips the file instead of trusting it). Persisting it is only
      # sound if the key changes whenever anything that decides a verdict does:
      #
      #   * every TypeScript file under agent/extensions, tests included. The
      #     command runner reports no per-test coverage, so stryker's own reuse
      #     rule degenerates to "same mutant, same result" — a weakened test would
      #     inherit a cache that predates it. Hashing the whole tree is what makes
      #     a changed test a cache miss instead of a stale Killed.
      #   * stryker.conf.json and the lockfile: a new stryker, timeout or mutator
      #     set is a different verdict on the same code.
      #   * the base sha, last, so a base move still restores through the
      #     restore-key prefix; reuse is by mutant identity, which a base move
      #     does not touch.
      #
      # The weekly `mutation` job has its own cache and its own key; that path is
      # never capped and never inherits this one.
      - name: restore incremental state
        if: steps.changed.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: agent/reports/stryker/stryker-incremental.json
          key: stryker-pr-${{ hashFiles('agent/extensions/**/*.ts') }}-${{ hashFiles('agent/stryker.conf.json', 'agent/package-lock.json', '.node-version') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            stryker-pr-${{ hashFiles('agent/extensions/**/*.ts') }}-${{ hashFiles('agent/stryker.conf.json', 'agent/package-lock.json', '.node-version') }}-

      # stryker 10's CLI has no --thresholds flag (it rejects
      # --thresholds.break) and no boolean `--incremental` value at all, so the PR
      # verdict is built from the weekly config with two keys changed: break 100,
      # so one surviving mutant fails the job, and its own report paths, so a
      # capped PR run never overwrites the weekly run's report. `incremental`
      # stays on — that is the cache above — and it is keyed so that nothing which
      # decides a mutant's verdict can be older than the cache. Derived, not
      # copied: the two configs cannot drift.
      - name: pr mutation config (break 100, cache-friendly)
        if: steps.changed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const base = JSON.parse(readFileSync("stryker.conf.json", "utf8"));
            writeFileSync("stryker.pr.conf.json", JSON.stringify({
              ...base,
              thresholds: { ...base.thresholds, break: 100 },
              htmlReporter: { fileName: "reports/stryker-pr/mutation.html" },
              jsonReporter: { fileName: "reports/stryker-pr/mutation.json" },
            }, null, 2) + "\n");
          '

      # A silent cap is a lie, so the cap is a step with an output, not a flag
      # buried in a command line: what it kept goes to stryker, what it deferred
      # goes into the job summary where the reviewer reads the verdict.
      - name: budget the run (200 mutants, the rest to the weekly job)
        id: budget
        if: steps.changed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          capped="$(bash ../scripts/mutate-changed.sh --base origin/trunk --cap 200 --list-only 2>budget.txt)"
          cat budget.txt
          cat budget.txt >>"$GITHUB_STEP_SUMMARY"

          if [[ -z $capped ]]; then
            # The changed lines hold no mutant at all (a comment-only hunk, say).
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "mutation on changed files: no mutant on the changed lines, nothing to run"
            exit 0
          fi

          echo "skip=false" >>"$GITHUB_OUTPUT"
          {
            echo "files<<MUTATE_EOF"
            printf '%s\n' "$capped"
            echo "MUTATE_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: stryker on exactly the added lines
        if: steps.changed.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        env:
          # Passed through env, never expanded into the script: paths and ranges
          # derived from untrusted file names stay quoted values (blip 38).
          MUTATE_FILES: ${{ steps.budget.outputs.files }}
        run: |
          set -euo pipefail
          # One --mutate value, comma separated. stryker 10.1.1's CLI splits it on
          # commas and keeps only the LAST --mutate it is given: measured here,
          # three ranges in three flags mutated only the third range (7 mutants,
          # not the 20 the ranges hold). Repeating the flag would silently narrow
          # the gate to one hunk per push.
          mutate="$(printf '%s' "$MUTATE_FILES" | paste -sd, -)"
          printf 'mutating: %s\n' "$mutate"
          # --concurrency 8 on a 4-core runner, measured, not assumed: 80
          # mutants on lib/usage-format.ts under `taskset -c 0-3` (the runner's
          # 4 vCPUs) took 109s at stryker's default 4 workers and 83s at 8, a
          # 24% cut, because each worker spends most of a mutant waiting on its
          # own `node --test` child processes rather than computing. 12 workers
          # only reached 75s (10% more) at double the memory, so 8 is the knee.
          npx stryker run stryker.pr.conf.json --concurrency 8 --mutate "$mutate"

      # The budget line above counts mutants the enumerator found; this counts the
      # ones stryker actually ran. They can differ by a mutant or two — a block
      # statement that starts on a selected line and ends past the range's last
      # line is clipped out of the run (measured: 20 enumerated, 18 tested) — so
      # both numbers go in the summary and neither stands in for the other.
      - name: what stryker actually ran
        if: always() && steps.budget.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [[ ! -f reports/stryker-pr/mutation.json ]]; then
            echo "mutation: no report, the run did not finish — see the artifact" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("reports/stryker-pr/mutation.json", "utf8"));
            const mutants = Object.values(report.files).flatMap((file) => file.mutants);
            const byStatus = {};
            for (const mutant of mutants) byStatus[mutant.status] = (byStatus[mutant.status] ?? 0) + 1;
            const parts = Object.entries(byStatus).map(([status, n]) => `${n} ${status.toLowerCase()}`);
            console.log(`mutation: stryker ran ${mutants.length} mutant(s): ${parts.join(", ") || "none"}`);
          ' >>"$GITHUB_STEP_SUMMARY"

      - name: keep the report
        if: always() && steps.changed.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-report-changed
          path: |
            agent/reports/stryker/
            agent/reports/stryker-pr/
          if-no-files-found: warn

  # The gates' own tests: scripts/tests/*.test.mjs and *.test.sh, the passing
  # case of every gate in this checkout (blip 29 harness quality evaluation —
  # a gate whose passing case was never run can go dead quietly). It used to be
  # a step inside harness-check.yml's job, where its 58s made that check two
  # minutes and a red suite could not be told from a red harness. Its own job
  # costs one runner and names itself: `scripts tests` red means the tests, only.
  #
  # It calls the Makefile target rather than a copy of the node command, so a
  # local `make scripts-test` and this job cannot disagree (blip 38 CI hardening).
  # Nothing is installed: the target needs node and bash and nothing else — no
  # npm install, no action beyond the two pinned below.
  scripts-tests:
    name: scripts tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # mise.toml's `node`, projected: setup-node cannot read a TOML file, and
          # a `node-version:` literal here FAILs the mise-pin check (blip 68).
          # Relative: setup-node joins node-version-file onto the workspace root.
          node-version-file: .node-version

      - name: scripts tests (make scripts-test)
        run: make scripts-test

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: syntax
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          printf '%s\n' "${files[@]}"
          for f in "${files[@]}"; do bash -n "$f"; done
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck --severity=error "${files[@]}"

  # Radar Vol. 35 blip 89 (Deepsec: a scanner in the pipeline) and blip 6 (threat
  # modelling — docs/threat-model.md is the scope statement this job checks that
  # code still lives up to). semgrep and trivy were installed on this machine and
  # ran in nothing: a scan nobody can point at is a habit, not a gate. One job,
  # one verdict — any finding fails the run — and the summary names every file
  # and package that was read, so green means "scanned and clean" rather than
  # "the step existed".
  security-scan:
    name: security scan (semgrep, trivy)
    runs-on: ubuntu-latest
    # A gate that makes a pull request wait ten minutes is a gate people turn
    # off. Cold, this is two pinned downloads plus a scan of ~60 files and one
    # lockfile; five minutes is the ceiling, not the target.
    timeout-minutes: 5
    env:
      SEMGREP_VERSION: 1.185.0
      TRIVY_VERSION: 0.76.2
      # `p/bash` is not a registry pack (semgrep.dev/c/p/bash is a 404), so the
      # shell ruleset is pinned by commit instead of by name: the same rule text
      # on every run, and a rule change is a reviewable edit to this line.
      SEMGREP_RULES_SHA: a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Nothing worth caching: uvx resolves one pinned package in seconds,
          # and a cache keyed on a sdist is one more thing to poison.
          enable-cache: false

      - name: install scanners (pinned)
        run: |
          set -euo pipefail
          # trivy: release tarball checked against the checksum the release
          # publishes. A version pin alone does not survive a replaced asset.
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "$base/$asset" -o "$RUNNER_TEMP/$asset"
          curl -sSfL "$base/trivy_${TRIVY_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          grep -F " $asset" "$RUNNER_TEMP/checksums.txt" >"$RUNNER_TEMP/asset.sha256"
          ( cd "$RUNNER_TEMP" && sha256sum --check --strict asset.sha256 )
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" trivy

          # The shell ruleset, pinned by the commit it came from.
          curl -sSfL "https://github.com/semgrep/semgrep-rules/archive/${SEMGREP_RULES_SHA}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          rules="$RUNNER_TEMP/semgrep-rules-${SEMGREP_RULES_SHA}"

          {
            echo "TRIVY_BIN=$RUNNER_TEMP/trivy"
            echo "SEMGREP_RULES=$rules"
          } >>"$GITHUB_ENV"

          "$RUNNER_TEMP/trivy" --version | sed -n '1p'
          printf 'semgrep-rules bash set: %s file(s) at %s\n' \
            "$(find "$rules/bash" -name '*.yaml' | wc -l)" "$SEMGREP_RULES_SHA"

      - name: semgrep (p/default, p/typescript, pinned bash rules)
        id: semgrep
        # A finding must not stop the other scanner from reporting: the verdict
        # step below is what fails the job, and the summary is most useful when
        # every scanner has spoken.
        continue-on-error: true
        run: |
          set -euo pipefail
          # Tracked source only, and as an explicit list: a green run can be
          # compared against `git ls-files`, so a file that stopped being
          # scanned shows up as a smaller number instead of as a pass.
          mapfile -t targets < <(git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.sh')
          printf 'semgrep targets: %d file(s)\n' "${#targets[@]}"
          # Registry packs need the network, which CI has; --json-output keeps the
          # JSON report next to the human one. --error is the gate: semgrep exits 0
          # on findings by default, so without it this job would be green on a
          # finding — measured, not assumed (1.185.0 returns 1 with --error and 0
          # without, on the same file).
          uvx --from "semgrep==${SEMGREP_VERSION}" semgrep scan \
            --config p/default \
            --config p/typescript \
            --config "${SEMGREP_RULES}/bash" \
            --metrics=off \
            --disable-version-check \
            --error \
            --json-output "$RUNNER_TEMP/semgrep.json" \
            "${targets[@]}"

      - name: trivy (dependencies, secrets, configuration)
        id: trivy
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          # --include-dev-deps on purpose: stryker and the test toolchain run in
          # this workflow, so a vulnerable dev dependency is a reachable one here.
          "$TRIVY_BIN" fs \
            --scanners vuln \
            --include-dev-deps \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "$RUNNER_TEMP/trivy-vuln.json" \
            . || status=1
          # Secrets and configuration: any finding fails, at any severity — a
          # leaked key in a tracked file is not a low-priority one.
          "$TRIVY_BIN" fs \
            --scanners secret,misconfig \
            --exit-code 1 \
            --format json \
            --output "$RUNNER_TEMP/trivy-rest.json" \
            . || status=1
          exit "$status"

      # always(): a red scan is exactly when the reader needs to know what was
      # read and which rule fired. A scanner that wrote no report says so instead
      # of counting as zero findings.
      - name: report what was scanned
        if: always()
        run: |
          set -euo pipefail
          export SCANNED_FILES="$(git ls-files | wc -l)"
          node .github/scripts/security-summary.mjs \
            "$RUNNER_TEMP/semgrep.json" \
            "$RUNNER_TEMP/trivy-vuln.json" \
            "$RUNNER_TEMP/trivy-rest.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # The one verdict. Both scan steps are continue-on-error so that a finding
      # in the first cannot hide the second scanner's report, and this step reads
      # their outcomes rather than trusting the job's colour: `success` is the
      # only value that means "ran and found nothing".
      - name: verdict
        if: always()
        env:
          # Through env, never expanded into the script.
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          set -euo pipefail
          printf 'semgrep: %s\ntrivy: %s\n' "$SEMGREP_OUTCOME" "$TRIVY_OUTCOME"
          if [ "$SEMGREP_OUTCOME" != success ] || [ "$TRIVY_OUTCOME" != success ]; then
            echo "::error::a scanner found something or did not finish - the summary above names what it read and what it found"
            exit 1
          fi
          echo "security scan clean: every scanner ran and reported nothing"
