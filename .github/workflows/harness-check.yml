# Harness budgets and metadata as checks, in CI and once a week.
#
# Radar basis: #29 harness quality evaluation, #36 agent instruction bloat,
# #99 Safe Chain. Blip 39 (documentation sprawl) needs a scheduled prune, not a
# paragraph: the weekly run is the automated "monthly delete a rule / quarterly
# re-audit" trigger from the playbook.
#
# PRs: catch a bloated AGENTS.md or skill before merge.
# Weekly: catch bit-rot the pull request path cannot see — an expired Review:
# date, an install step someone unset, a doc that lost its owner.
#
# The gates' own tests are here (`offline gate tests`) and in test.yml
# (`scripts tests`), not both here: `make scripts-test` cost this job 58s of its
# two minutes, and a check that is red because it carries another check's work
# does not say which one broke. Both are still the same commands a laptop runs.
name: harness-check

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Relative: setup-node joins node-version-file onto the workspace root,
          # so an absolute value becomes <workspace>/<workspace>/.node-version.
          node-version-file: .node-version # mise.toml's `node` projected; drift FAILs check_mise_pins

      # npm is bumped because min-release-age is only honoured from 11.10 on
      # (blip 99), and its major must match mise.toml's `npm`: drift is a FAIL.
      - name: npm ≥ 11 (min-release-age only exists from 11.10)
        run: npm install -g npm@11.21.2  # zizmor: ignore[adhoc-packages]

      # Provision the runner the way setup.sh provisions a laptop, so the config
      # checks test the installer rather than the runner's defaults.
      - name: provision (npm release age + global hooks + template layer)
        run: |
          set -euo pipefail
          npm config set min-release-age 2
          mkdir -p "$HOME/.pi"
          cp -R git-hooks "$HOME/.pi/git-hooks"
          bash "$HOME/.pi/git-hooks/install-hooks.sh"
          echo "hooksPath  : $(git config --global --get core.hooksPath)"
          echo "templateDir: $(git config --global --get init.templateDir)"
          echo "templates  : $(find "$HOME/.git-templates/hooks" -maxdepth 1 -type f | wc -l) files"

      - name: harness-check
        run: bash scripts/harness-check.sh

      # The offline gate tests: the skill pin in agent/skills.lock and the
      # hidden-codepoint scan in the pre-commit hook. Both build their own temp
      # repos and their own git config, so they need no network and nothing from
      # the runner (blip 29 harness quality evaluation, blip 72 agent package
      # manager). Same script as `make offline-test`, and no action to pin.
      - name: offline gate tests (scripts/ci-offline.sh)
        run: bash scripts/ci-offline.sh

      - name: harness-check (json, for the log)
        if: always()
        run: bash scripts/harness-check.sh --json | python3 -m json.tool >/dev/null
